# Builds the Windows installer, the Mac disk images, the Android APK and the iOS simulator app, and attaches them to the
# GitHub release for the tag. Run it by pushing a tag (git tag v1.0.0 && git push origin v1.0.0) or by hand from the
# Actions tab (the files are then kept as workflow artifacts only).
# At most one run per 24 hours: a run that starts while another started less than a day ago stops at the "gate" job
# and builds nothing (so it costs nothing). Run it by hand with "force" ticked to build anyway.
# The store builds (Play .aab, App Store .ipa) are still made with EAS (see the README).
name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: Build even if a run started in the last 24 hours
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --created ">=$since" --limit 100 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion != \"skipped\" and .conclusion != \"cancelled\")] | length")
          echo "Runs of this workflow in the last 24 hours: $recent"
          if [ "$recent" -gt 0 ] && [ "$FORCE" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipped: a build already started in the last 24 hours. Run it by hand with force ticked to build anyway."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  android:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the android project (never committed)
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the ios project (never committed)
        run: npx expo prebuild --platform ios --no-install
      - name: Build for the simulator (unsigned)
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          mkdir -p out
          tar -czf out/ios-simulator.tar.gz -C ios/build/Build/Products/Release-iphonesimulator "$scheme.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/ios-simulator.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.go == 'true'
    needs: [gate, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Name the mobile builds after the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          mv files/app-release.apk "files/go-flashcards-$v-android.apk"
          mv files/ios-simulator.tar.gz "files/go-flashcards-$v-ios-simulator.tar.gz"
      - name: Attach to the release (created if the tag has none)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Go Flashcards $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --clobber
